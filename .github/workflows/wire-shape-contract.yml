name: Wire-Shape Contract

# QF-14 Java arm: blocks drift between Java @JsonProperty-annotated
# classes and the OpenAPI specs that are the authoritative wire
# contract. Runs on every PR and push to main. Drift NOT covered by
# the baseline fails the check.
#
# The specs are a schema snapshot committed under tests/fixtures/openapi/
# (see its README), derived by scripts/snapshot_openapi_schemas.py from
# the platform's docs/api at the commit recorded as openapi_specs_sha in
# tests/fixtures/wire-shape-baseline.json, so the gate is deterministic.
# A 'spec-pin-bump' label is required on PRs that change that SHA OR any
# file under tests/fixtures/openapi/, preserving review integrity (a PR
# that both moved the pin and the Java classes could otherwise silence
# drift).
#
# To regenerate the snapshot and the baseline, see
# tests/fixtures/openapi/README.md.

on:
  pull_request:
    branches: [main]
    # The pin guard reads the PR's labels from the event payload. A label
    # attached after the PR opens (`gh pr create --label` adds it in a
    # second call) is not in the `opened` payload, so the guard must re-run
    # when a label is added or removed, or its verdict describes stale
    # labels.
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths:
      - 'src/main/java/**/*.java'
      - 'tests/fixtures/wire-shape-baseline.json'
      - 'tests/fixtures/audit-binding-allowlist.json'
      - 'tests/fixtures/openapi/**'
      - 'scripts/wire_shape/**'
      - 'scripts/snapshot_openapi_schemas.py'
      # pom.xml governs the Jackson version - exactly what changes the
      # Gate 5 probe's view of the wire - so a dependency bump must
      # re-run this job.
      - 'pom.xml'
      - '.github/workflows/wire-shape-contract.yml'
  push:
    branches: [main]
    paths:
      - 'src/main/java/**/*.java'
      - 'tests/fixtures/wire-shape-baseline.json'
      - 'tests/fixtures/audit-binding-allowlist.json'
      - 'tests/fixtures/openapi/**'
      - 'scripts/wire_shape/**'
      - 'scripts/snapshot_openapi_schemas.py'
      # pom.xml governs the Jackson version - exactly what changes the
      # Gate 5 probe's view of the wire - so a dependency bump must
      # re-run this job.
      - 'pom.xml'
      - '.github/workflows/wire-shape-contract.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  wire-shape:
    name: Validate Wire Shape
    runs-on: ubuntu-latest
    env:
      AXONFLOW_TELEMETRY: 'off'
    steps:
      - name: Checkout SDK (full history for the pin guard)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read pinned OpenAPI specs SHA from baseline
        id: specs_sha
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import sys
          path = "tests/fixtures/wire-shape-baseline.json"
          data = json.load(open(path))
          sha = (data.get("openapi_specs_sha", "") or "").strip()
          if not sha:
              print(
                  f"::error::{path} is missing openapi_specs_sha. "
                  "Regenerate via scripts/wire_shape/refresh.py.",
                  file=sys.stderr,
              )
              sys.exit(1)
          print(f"sha={sha}")
          PY

      - name: Guard against an unauthorized pin or snapshot change
        if: github.event_name == 'pull_request'
        env:
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          BASE_REF: ${{ github.base_ref }}
          PR_SHA: ${{ steps.specs_sha.outputs.sha }}
        run: |
          set -e
          BASE_FILE=$(mktemp)
          if git show "origin/${BASE_REF}:tests/fixtures/wire-shape-baseline.json" > "$BASE_FILE" 2>/dev/null; then
            # File exists on the base branch. It MUST parse — a malformed
            # baseline file would otherwise let `BASE_SHA` come back empty
            # and route this PR through the "first pin introduction"
            # bypass below, silently authorizing a SHA bump.
            BASE_SHA=$(python3 -c "import json, sys; print(json.load(open(sys.argv[1])).get('openapi_specs_sha','') or '')" "$BASE_FILE")
          else
            # File genuinely absent on the base branch (first-time
            # introduction). Distinguishing this from "file present but
            # unparseable" is what guards the bypass.
            BASE_SHA=""
          fi
          rm -f "$BASE_FILE"
          if [ -z "$BASE_SHA" ]; then
            if git cat-file -e "origin/${BASE_REF}:tests/fixtures/wire-shape-baseline.json" 2>/dev/null; then
              echo "::error::tests/fixtures/wire-shape-baseline.json on origin/${BASE_REF} parsed with empty openapi_specs_sha."
              echo "::error::This is unrecoverable from inside the gate. Re-run scripts/wire_shape/refresh.py on main."
              exit 1
            fi
            echo "::notice::Base branch has no wire-shape-baseline.json yet; treating this PR as first pin introduction."
            exit 0
          fi
          # A git error here reads as "changed", so the label is required:
          # the guard fails closed.
          SNAPSHOT_CHANGED=false
          if ! git diff --quiet "origin/${BASE_REF}...HEAD" -- tests/fixtures/openapi/; then
            SNAPSHOT_CHANGED=true
          fi
          if [ "$BASE_SHA" = "$PR_SHA" ] && [ "$SNAPSHOT_CHANGED" = false ]; then
            echo "openapi_specs_sha unchanged (${PR_SHA}) and tests/fixtures/openapi/ unchanged."
            exit 0
          fi
          echo "Pin change detected: openapi_specs_sha ${BASE_SHA} -> ${PR_SHA}; snapshot changed: ${SNAPSHOT_CHANGED}"
          HAS_LABEL=$(printf '%s' "$PR_LABELS" | python3 -c "import json, sys; print('spec-pin-bump' in json.load(sys.stdin))")
          if [ "$HAS_LABEL" = "True" ]; then
            echo "::notice::'spec-pin-bump' label present — the pin change is authorized."
            exit 0
          fi
          if [ "$BASE_SHA" != "$PR_SHA" ]; then
            echo "::error::openapi_specs_sha changed from ${BASE_SHA} to ${PR_SHA}."
          fi
          if [ "$SNAPSHOT_CHANGED" = true ]; then
            echo "::error::tests/fixtures/openapi/ changed; the spec snapshot is part of the pin."
          fi
          echo "::error::The wire-shape contract's spec revision is pinned to preserve"
          echo "::error::review integrity: a pin change in the same PR as SDK changes"
          echo "::error::can silence drift by retargeting the contract to a friendlier"
          echo "::error::revision. Either split this into a dedicated pin-bump PR, or"
          echo "::error::apply the 'spec-pin-bump' label to this PR."
          exit 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyYAML
        run: pip install 'pyyaml>=6,<7'

      - name: Check the committed spec snapshot
        # The derivation's own self-test, then the committed snapshot must be
        # exactly the script's derived form (prose, types or a spec copied in
        # verbatim are refused). Any change to it also needs the label above.
        run: |
          python3 scripts/snapshot_openapi_schemas.py --self-test
          python3 scripts/snapshot_openapi_schemas.py --check-snapshot tests/fixtures/openapi

      # Gate 5 (audit-surface binding, #3254) introspects the COMPILED
      # classes via Jackson (scripts/wire_shape/AuditWireKeysProbe.java)
      # instead of trusting source-regex discovery, which is defeated by
      # constant-valued @JsonProperty annotations and by Jackson getter
      # auto-detection. The validator FAILS (never skips) if these
      # artifacts are missing.
      - name: Set up JDK 17 (Gate 5 wire-key introspection)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Compile SDK classes + dependency classpath (Gate 5)
        run: |
          mvn -q -B compile dependency:build-classpath \
            -Dmdep.outputFile=target/wire-shape-cp.txt

      - name: Run wire-shape contract validator
        env:
          AXONFLOW_OPENAPI_SPECS_DIR: ${{ github.workspace }}/tests/fixtures/openapi
        run: python3 scripts/wire_shape/validate.py
