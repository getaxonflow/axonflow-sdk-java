name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Cancel orphaned PR runs when a new commit is pushed; push to main uses SHA so
# main runs never queue or cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  AXONFLOW_TELEMETRY: 'off'

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      # PR runs only Java 17 (current release toolchain). Push to main and
      # workflow_dispatch run the full [11, 17, 21] matrix to validate
      # version-specific drift before the next tag. Cuts PR-time wallclock
      # ~2/3 (5.2m → ~2m on the heaviest workflow in the SDK fleet).
      matrix:
        java-version: ${{ fromJson(github.event_name == 'pull_request' && '[17]' || '[11, 17, 21]') }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Configure Maven mirror
        uses: ./.github/actions/setup-maven

      - name: Build with Maven
        run: |
          for i in 1 2 3; do
            echo "Attempt $i: Building..."
            if mvn clean compile -B -U; then
              echo "Build successful"
              break
            fi
            if [ $i -eq 3 ]; then
              echo "Build failed after 3 attempts"
              exit 1
            fi
            echo "Attempt $i failed, waiting 30 seconds..."
            sleep 30
          done

      - name: Run unit tests
        run: |
          for i in 1 2 3; do
            echo "Attempt $i: Running tests..."
            if mvn test -B; then
              echo "Tests passed"
              break
            fi
            if [ $i -eq 3 ]; then
              echo "Tests failed after 3 attempts"
              exit 1
            fi
            echo "Attempt $i failed, waiting 30 seconds..."
            sleep 30
          done

      - name: Generate coverage report
        if: matrix.java-version == 17
        run: mvn jacoco:report -B

      - name: Upload coverage to Codecov
        if: matrix.java-version == 17
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: target/site/jacoco/jacoco.xml
          flags: unittests
          name: codecov-java-sdk
          fail_ci_if_error: false

      - name: Check coverage threshold
        if: matrix.java-version == 17
        run: mvn jacoco:check -B

  # Aggregator that always reports a single check name regardless of the
  # matrix shape (PR-time matrix is `[17]`; push/dispatch is `[11, 17, 21]`).
  # Branch protection requires `Build Summary`, not the per-version names,
  # so matrix changes don't strand required checks.
  build-summary:
    name: Build Summary
    needs: [build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate build matrix result
        run: |
          result="${{ needs.build.result }}"
          echo "build matrix result: $result"
          if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
            echo "::error::build matrix did not all pass (result: $result)"
            exit 1
          fi
          echo "Build matrix OK"

  # Every example must build. The root pom declares NO <modules>, so `mvn
  # compile`, `mvn package` and the `build` job above never descend into
  # examples/ - an example could be committed with a missing import, a renamed
  # method or a class that does not exist and every check on the PR would stay
  # green. That is how examples/authzen reached this branch with 362 lines and
  # zero compile coverage.
  #
  # This runs on PULL_REQUEST, unlike the live-integration job in
  # integration.yml, which is `if: github.event_name != 'pull_request'`. Compile
  # coverage that only happens after merge is not coverage of the PR.
  #
  # ORDER MATTERS. The install has to come FIRST: the rewrite makes each example
  # ask for the version in the root pom, and only the install puts that version
  # in the local repository for it to find. Without the install, an example
  # asking for an unreleased coordinate fails to resolve; without the rewrite, an
  # example silently resolves an OLD published SDK from Central and proves
  # nothing about this branch. Four of the five examples currently pin a version
  # one release behind the root pom, which is exactly what the rewrite is for.
  examples:
    name: Examples Compile
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Configure Maven mirror
        uses: ./.github/actions/setup-maven

      # 3-attempt retry for transient Maven Central flakes, the same pattern
      # `Build with Maven` and integration.yml's install step use.
      - name: Install SDK to local Maven repo
        run: |
          for i in 1 2 3; do
            echo "Attempt $i: mvn install"
            if mvn install -DskipTests -DskipUnitTests=true -Djacoco.skip=true -B -U; then break; fi
            if [ $i -eq 3 ]; then exit 1; fi
            sleep 30
          done

      # No pom arguments: the script rewrites every examples/*/pom.xml it finds,
      # so an example added tomorrow is covered without editing this workflow.
      # It exits non-zero on a pom whose layout drifted past the pattern rather
      # than skipping it, because a skipped rewrite reads exactly like a
      # successful one.
      - name: Pin every example to the SDK version in the root pom
        run: |
          PARENT_VERSION=$(mvn -B -q -DforceStdout help:evaluate -Dexpression=project.version)
          echo "Root pom SDK version: ${PARENT_VERSION}"
          python3 .github/scripts/sync-example-sdk-versions.py "${PARENT_VERSION}"

      - name: Compile every example
        run: |
          set -euo pipefail
          # Counted, not just iterated: an empty examples/ would run zero builds
          # and exit 0, which is indistinguishable from every example compiling.
          built=0
          for pom in examples/*/pom.xml; do
            example=$(dirname "$pom")
            echo "::group::compile ${example}"
            (cd "${example}" && mvn -B -q compile)
            echo "::endgroup::"
            built=$((built + 1))
          done
          if [ "$built" -lt 1 ]; then
            echo "::error::no examples were compiled; examples/*/pom.xml matched nothing"
            exit 1
          fi
          echo "compiled ${built} example(s)"

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Configure Maven mirror
        uses: ./.github/actions/setup-maven

      - name: Check code formatting
        run: |
          # BOTH arms of the previous loop broke on attempt 1, so this step exited 0
          # whether the check passed or failed and a violation printed "Code formatting
          # check skipped" under a green tick. The loop conflated two failures that need
          # opposite handling: a dependency-resolution failure is worth retrying, a
          # formatting violation must fail the job immediately. They are separated here.
          set -uo pipefail
          attempt=1
          max=3
          extra=""
          while :; do
            echo "Attempt ${attempt}: checking formatting..."
            out=$(mvn com.spotify.fmt:fmt-maven-plugin:check -B ${extra} 2>&1) && status=0 || status=$?
            printf '%s\n' "$out"

            if [ "$status" -eq 0 ]; then
              echo "Formatting check passed"
              exit 0
            fi

            # A violation is a RESULT, not a flake.
            #
            # Matched with bash's own pattern test, NOT `printf ... | grep -q`. Under
            # `set -o pipefail` that pipeline is a RACE: grep -q exits at the first
            # match, printf then dies of SIGPIPE, and pipefail reports the pipeline as
            # FAILED even though the match succeeded. With short output printf finishes
            # first and it works; with real Maven output it does not. Measured here at
            # 60k lines: the violation branch was skipped and a formatting failure was
            # misreported as "not a known transient".
            if [[ "$out" == *"Non complying file"* ]]; then
              echo "::error::Formatting violations found. Fix with: mvn com.spotify.fmt:fmt-maven-plugin:format"
              grep "Non complying file" <<< "$out" >&2 || true
              exit 1
            fi

            # Only a resolution/network failure earns another attempt. Anything
            # unrecognised fails rather than passing, so a new failure mode cannot
            # inherit the old step's silence.
            transient=0
            for marker in "Could not resolve" "Could not transfer" "Connection refused" \
                          "Read timed out" "UnknownHost"; do
              if [[ "$out" == *"$marker"* ]]; then transient=1; break; fi
            done
            if [ "$transient" -eq 0 ]; then
              echo "::error::Formatting check failed for a reason that is not a known transient."
              exit 1
            fi

            if [ "${attempt}" -ge "${max}" ]; then
              echo "::error::Formatting check could not run after ${max} attempts (dependency resolution)."
              exit 1
            fi
            attempt=$((attempt + 1))
            extra="-U"
            echo "Transient resolution failure; retrying in 30s..."
            sleep 30
          done

  package:
    runs-on: ubuntu-latest
    needs: [build, lint]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Configure Maven mirror
        uses: ./.github/actions/setup-maven

      - name: Package JAR
        run: |
          for i in 1 2 3; do
            echo "Attempt $i: Packaging..."
            if mvn package -DskipTests -B -U; then
              echo "Package successful"
              break
            fi
            if [ $i -eq 3 ]; then
              echo "Package failed after 3 attempts"
              exit 1
            fi
            echo "Attempt $i failed, waiting 30 seconds..."
            sleep 30
          done

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: axonflow-sdk-java
          path: target/*.jar
          retention-days: 7
