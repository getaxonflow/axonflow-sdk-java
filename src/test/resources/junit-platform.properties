# Auto-detect JUnit 5 extensions declared in META-INF/services.
#
# Enabled for AdapterRegistryIsolationExtension: the telemetry adapter registry is a
# process-global static, so an adapter constructed by ANY test leaks into every later
# test's payload. The isolation has to apply to tests that have never heard of the
# registry — TelemetryReporterTest.testPayloadFormat asserts an empty `features` array and
# knows nothing about LangGraphAdapterTest — which is what a global extension gives and an
# @ExtendWith on the interested classes does not.
junit.jupiter.extensions.autodetection.enabled=true
